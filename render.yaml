# Bauplan für Render (render.com): beschreibt, wie die Web-App online gestartet wird.
services:
  - type: web
    name: doeneros-lite
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
